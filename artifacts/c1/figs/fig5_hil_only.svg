   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="39.6" y="130.025078" transform="rotate(-0 39.6 130.025078)">HIL-only. Inject damaged packets; observe rejection, recovery and safe command handling.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233c52" x="39.6" y="183.79872" transform="rotate(-0 39.6 183.79872)">F10 / Board–PC clock drift</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="39.6" y="211.854517" transform="rotate(-0 39.6 211.854517)">HIL-only. Measure timestamp alignment, drift accumulation and stale-frame handling.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233c52" x="39.6" y="265.62816" transform="rotate(-0 39.6 265.62816)">F6 / Actual missed deadlines</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(39.6 293.683958)">SIL skips controller calls and holds force. Real ISR timing must be measured on hardware.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(39.6 308.680989)">Frozen C32 rejects tick gaps: 96 attempted cases are INVALID, not task FAIL.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233c52" x="39.6" y="347.4576" transform="rotate(-0 39.6 347.4576)">Scope of equivalence</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(39.6 375.513397)">Both full-matrix controllers use the Python injector. Rust is separately byte-checked.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(39.6 390.510429)">No Rust closed-loop, hardware, clinical or cross-platform full-matrix claim.</text>
   </g>
