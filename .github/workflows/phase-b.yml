name: Phase B C32

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install frozen simulation dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Check and build Rust harness
        run: |
          cargo +1.99.0 fmt --manifest-path harness/Cargo.toml --check
          cargo +1.99.0 clippy --manifest-path harness/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.99.0 test --manifest-path harness/Cargo.toml --locked
          cargo +1.99.0 build --manifest-path harness/Cargo.toml --locked --release
      - name: Build core, test adapter and compare C32 against Python preview
        run: python -m harness.ci --output artifacts/phase-b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-b-c32-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/phase-b/
          if-no-files-found: error

  cross-c32:
    needs: host-core
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/download-artifact@v4
        with:
          name: phase-b-c32-ubuntu-24.04-${{ github.sha }}
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: phase-b-c32-windows-2022-${{ github.sha }}
          path: artifacts/windows
      - name: Compare primary with registered C32 budget
        run: python -m harness.compare artifacts/linux/primary/preview_c32 artifacts/windows/primary/preview_c32 --output artifacts/comparison/primary.json
      - name: Compare diagnostic with registered C32 budget
        run: python -m harness.compare artifacts/linux/paper_effective/preview_c32 artifacts/windows/paper_effective/preview_c32 --output artifacts/comparison/paper_effective.json
      - name: Compare Rust FFI primary across platforms
        run: python -m harness.compare artifacts/linux/primary/rust_ffi artifacts/windows/primary/rust_ffi --output artifacts/comparison/rust-primary.json
      - name: Compare Rust FFI diagnostic across platforms
        run: python -m harness.compare artifacts/linux/paper_effective/rust_ffi artifacts/windows/paper_effective/rust_ffi --output artifacts/comparison/rust-paper_effective.json
      - name: Compare virtual-board primary across platforms
        run: python -m harness.compare artifacts/linux/primary/rust_virtual artifacts/windows/primary/rust_virtual --output artifacts/comparison/virtual-primary.json
      - name: Compare virtual-board diagnostic across platforms
        run: python -m harness.compare artifacts/linux/paper_effective/rust_virtual artifacts/windows/paper_effective/rust_virtual --output artifacts/comparison/virtual-paper_effective.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-b-c32-comparison-${{ github.sha }}
          path: artifacts/comparison/
          if-no-files-found: error

  arm-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/cache@v4
        id: arm
        with:
          path: .toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi
          key: arm-gnu-14.2.rel1-linux-x64-62a63b98
      - name: Download pinned official Arm compiler
        if: steps.arm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .toolchains
          curl --fail --location --retry 3 https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz -o .toolchains/arm.tar.xz
          echo '62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  .toolchains/arm.tar.xz' | sha256sum --check
          tar -xJf .toolchains/arm.tar.xz -C .toolchains
      - name: Cross-compile Cortex-M7 core with Arm GNU 14.2
        run: python tools/build_controller.py --output artifacts/arm-build --arm-cc .toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-gcc
      - uses: actions/cache@v4
        with:
          path: .toolchains/firmware-deps/
          key: h723-vendor-${{ hashFiles('firmware/deps.lock.json') }}
      - name: Link H723 firmware and check memory, vectors, and hard-float ABI
        run: python -m tools.build_firmware --output artifacts/h723-build --arm-cc .toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-gcc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-b-h723-${{ github.sha }}
          path: artifacts/h723-build/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-b-arm-${{ github.sha }}
          path: artifacts/arm-build/
          if-no-files-found: error
