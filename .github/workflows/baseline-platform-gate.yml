name: Baseline Linux determinism gate

on:
  push:
    paths:
      - .github/workflows/baseline-platform-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out the original 43-test baseline
        uses: actions/checkout@v4
        with:
          ref: 24e4dd42cad761f23eabcdf7012c61be4e4a970b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run the unchanged baseline CI job
        run: python -m sim.ci --output artifacts
      - name: Compare exact trace hashes with the local Windows baseline
        if: success()
        shell: python
        run: |
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("artifacts")
          expected = {
              "primary": "66422ccb08f67fe12d37936578bae832bf5b9a3d8fd73b357e82b1861ff118a2",
              "paper_effective": "cc7e3e7e556c7719c6ff37ac3f2b1581179f286d8ccf452838acac02e5a8998d",
          }
          suite = ET.parse(root / "tests.xml").getroot().find("testsuite").attrib
          report = {"tests": suite, "profiles": {}}
          for profile, reference in expected.items():
              run = root / profile / "lab_frame_pd"
              metrics = json.loads((run / "metrics.json").read_text())
              actual = hashlib.sha256((run / "trace.jsonl").read_bytes()).hexdigest()
              repeated = hashlib.sha256((run / "repeat_trace.jsonl").read_bytes()).hexdigest()
              report["profiles"][profile] = {
                  "expected_sha256": reference,
                  "actual_sha256": actual,
                  "repeat_sha256": repeated,
                  "same_seed_identical": actual == repeated,
                  "matches_windows": actual == repeated == reference,
                  "environment": metrics["environment"],
              }
          report["passed"] = (
              suite["tests"] == "43"
              and all(suite[k] == "0" for k in ("errors", "failures", "skipped"))
              and all(p["matches_windows"] for p in report["profiles"].values())
          )
          encoded = json.dumps(report, indent=2) + "\n"
          (root / "platform_gate.json").write_text(encoded, encoding="utf-8")
          print(encoded)
          raise SystemExit(0 if report["passed"] else 1)
      - name: Preserve evidence even when platform hashes differ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-linux-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
